<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tandem Race - Scoreboard</title>
  <link rel="stylesheet" href="/static/style.css?v=2">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
</head>
<body class="sb-screen">
  <div class="page">
    <header class="sb-top-shell">
      <div class="sb-top-main">
        <div>
          <p class="sb-brand-small text-display">Tandem Race</p>
          <h1 class="sb-brand-title text-display">Live Timing</h1>
          <p id="brand-meta" class="sb-brand-meta text-mono">Lap 9 km · 180 min</p>
        </div>
        <!-- <div class="sb-clock-wrap">
          <p class="sb-clock-label text-display">Project</p>
          <img class="sb-qr" src="/qr.png" alt="scan to open the project repository">
        </div> -->
        <div class="sb-clock-wrap">
          <p class="sb-clock-label text-display">Remaining</p>
          <p id="race-clock-remaining" class="sb-clock-value text-mono js-remaining-time">03:00:00</p>
        </div>
        <div class="sb-clock-wrap">
          <p class="sb-clock-label text-display">Mode</p>
          <span id="phase-pill" class="sb-phase-pill text-display">phase: registry</span>
        </div>
      </div>
      <div class="sb-live-strip">
        <p class="sb-live-left text-mono">· Live</p>
        <p class="sb-live-right text-mono">Leaderboard display</p>
      </div>
    </header>

    <section class="card sb-score-panel">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Rank</th>
              <th>Team</th>
              <th>Laps</th>
              <th>Current timer</th>
              <th>Last lap</th>
              <th>Best lap</th>
            </tr>
          </thead>
          <tbody id="teams-body"></tbody>
        </table>
      </div>
    </section>

    <section id="charts-section" class="card sb-score-panel sb-charts-panel is-hidden">
      <h2>Final charts</h2>
      <div class="sb-charts">
        <div class="sb-chart-box">
          <canvas id="laps-over-time-chart"></canvas>
        </div>
        <div class="sb-chart-box">
          <canvas id="lap-duration-chart"></canvas>
        </div>
      </div>
    </section>
  </div>

  <footer class="sb-footer">
    <img class="sb-footer-qr" src="/qr.png" alt="scan to open the project repository">
    <span class="sb-footer-credit text-mono">github.com/webertom6/race_lap_software</span>
    <span class="sb-footer-remaining text-mono">Remaining: <strong class="js-remaining-time">03:00:00</strong></span>
  </footer>

  <script src="/static/shared.js"></script>
  <script src="/static/scoreboard.js"></script>
</body>
</html>
