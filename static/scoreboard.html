<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tandem Race - Scoreboard</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
</head>
<body class="screen">
  <div class="page">
    <header class="top-shell">
      <div class="top-main">
        <div>
          <p class="brand-small">Tandem Race</p>
          <h1 class="brand-title">Live Timing</h1>
          <p class="brand-meta">Lap 9 km · 180 min</p>
        </div>
        <div class="clock-wrap">
          <p class="clock-label">Race clock</p>
          <p id="race-clock-elapsed" class="clock-value">00:00:00</p>
        </div>
        <div class="clock-wrap">
          <p class="clock-label">Remaining</p>
          <p id="race-clock-remaining" class="clock-value">03:00:00</p>
        </div>
        <div class="clock-wrap">
          <p class="clock-label">Mode</p>
          <span id="phase-pill" class="phase-pill">phase: registry</span>
        </div>
      </div>
      <div class="live-strip">
        <p class="live-left">Live</p>
        <p class="live-right">Leaderboard display</p>
      </div>
    </header>

    <section class="card score-panel">
      <h2 class="display score-heading">Leaderboard</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Rank</th>
              <th>Team</th>
              <th>Laps</th>
              <th>Current timer</th>
              <th>Last lap</th>
              <th>Best lap</th>
            </tr>
          </thead>
          <tbody id="teams-body"></tbody>
        </table>
      </div>
    </section>

    <section id="charts-section" class="card score-panel charts-panel" style="display: none;">
      <h2>Final charts</h2>
      <div class="charts">
        <div class="chart-box">
          <canvas id="laps-over-time-chart"></canvas>
        </div>
        <div class="chart-box">
          <canvas id="lap-duration-chart"></canvas>
        </div>
      </div>
    </section>
  </div>

  <script src="/static/scoreboard.js"></script>
</body>
</html>
